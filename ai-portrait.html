<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Enable full-screen mode on iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">		
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portrait Slideshow</title>
  <style>
  /* Reset margins and ensure full viewport usage */
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background-color: #000;
  }
  
  /* Fullscreen slideshow container - 3 images side-by-side */
  #slideshow {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    flex-wrap: nowrap;
    overflow: hidden;
    width: 100%;
    height: 100vh;
    position: relative;
  }

  /* Image containers for layered transitions */
  .image-container {
    position: relative;
    height: 90vh;
    width: calc(90vh * 832 / 1248); /* Maintain 832:1248 aspect ratio */
    max-width: 30vw; /* Fallback to ensure three images fit */
    overflow: hidden;
  }

  .image-container img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transition: opacity 2s ease-in-out;
    opacity: 0;
    object-fit: cover;
  }

  .image-container img.active {
    opacity: 1;
  }

  /* Position containers in fixed slots */
  .image-container[data-position="0"] {
    order: 1;
  }
  .image-container[data-position="1"] {
    order: 2;
  }
  .image-container[data-position="2"] {
    order: 3;
  }

  /* Blurred background pseudo-element */
  #slideshow::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: var(--current-image);
    background-size: cover;
    background-position: center;
    filter: blur(20px);
    transform: scale(1.1); /* To avoid gaps at the edges */
    transition: background-image 2s ease-in-out;  
    z-index: -1;
  }

  /* Navigation areas (hidden by default) */
  .nav-area {
    position: fixed;
    top: 0;
    height: 100%;
    z-index: 1000;
    cursor: pointer;
  }
  #nav-left {
    left: 0;
    width: 20%;
  }
  #nav-right {
    right: 0;
    width: 20%;
  }
  
  /* Gear icon and settings panel */
  #gearIcon {
    position: fixed;
    top: 10px;
    right: 10px;
    font-size: 24px;
    cursor: pointer;
    opacity: 0.7;
    z-index: 2000;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    border-radius: 4px;
    padding: 5px;
  }
  #gearIcon:hover {
    opacity: 1;
  }
  #settingsPanel {
    position: fixed;
    top: 50px;
    right: 10px;
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    padding: 15px;
    border-radius: 4px;
    z-index: 2000;
    display: none;
  }
  #settingsPanel label {
    display: block;
    margin-bottom: 10px;
  }
  #settingsPanel input {
    width: 100%;
    padding: 5px;
    margin-top: 5px;
    box-sizing: border-box;
  }
  #settingsPanel button {
    margin-top: 10px;
    padding: 5px 10px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <!-- Gear Icon & Settings Panel -->
  <div id="gearIcon">&#9881;</div>
  <div id="settingsPanel">
    <label>
      Min Display Duration (seconds):
      <input type="number" id="minDuration" value="30" min="10" max="300">
    </label>
    <label>
      Max Display Duration (seconds):
      <input type="number" id="maxDuration" value="120" min="30" max="300">
    </label>
    <label>
      Transition Duration (ms):
      <input type="number" id="transitionDuration" value="2000" min="500" max="5000">
    </label>
    <button id="applySettings">Apply Settings</button>
    <button id="closeSettings">Close</button>
  </div>
  
  <!-- Slideshow Container -->
  <div id="slideshow"></div>
  
  <!-- Hidden Navigation Areas -->
  <div id="nav-left" class="nav-area"></div>
  <div id="nav-right" class="nav-area"></div>
  
  <script>
    let images = [];
    let currentImages = []; // Track currently displayed images
    let timers = []; // Individual timers for each image
    let isTransitioning = false;
    let minDuration = parseInt(document.getElementById('minDuration').value) * 1000;
    let maxDuration = parseInt(document.getElementById('maxDuration').value) * 1000;
    let transitionDuration = parseInt(document.getElementById('transitionDuration').value);
    
    const slideshow = document.getElementById('slideshow');
    const gearIcon = document.getElementById('gearIcon');
    const settingsPanel = document.getElementById('settingsPanel');
    const navLeft = document.getElementById('nav-left');
    const navRight = document.getElementById('nav-right');
    
    // Fisher-Yates shuffle to randomize image order
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }
    
    // Get random duration between min and max
    function getRandomDuration() {
      return Math.random() * (maxDuration - minDuration) + minDuration;
    }
    
    // Load images from the server API endpoint
    function loadImages() {
      console.log('Loading images from /api/ai-portrait...');
      fetch('/api/ai-portrait')
        .then(response => {
          console.log('Response status:', response.status);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          console.log('Images loaded:', data.length);
          images = shuffleArray(data);
          if (images.length >= 3) {
            initializeSlideshow();
          } else {
            slideshow.innerHTML = "<p style='color: white; text-align: center; margin-top: 45vh;'>Need at least 3 images for slideshow. Found: " + images.length + "</p>";
          }
        })
        .catch(error => {
          console.error('Error loading images:', error);
          slideshow.innerHTML = "<p style='color: white; text-align: center; margin-top: 45vh;'>Error loading images: " + error.message + "</p>";
        });
    }
    
    // Initialize slideshow with three random images
    function initializeSlideshow() {
      console.log('Initializing slideshow with', images.length, 'images');
      
      // Pick three random different images
      const shuffledImages = shuffleArray(images);
      currentImages = shuffledImages.slice(0, 3);
      
      console.log('Selected initial images:', currentImages);
      
      // Create containers and images
      currentImages.forEach((imageSrc, index) => {
        console.log(`Creating image ${index}: ${imageSrc}`);
        
        // Create container
        const container = document.createElement('div');
        container.className = 'image-container';
        container.dataset.position = index;
        slideshow.appendChild(container);
        
        // Create image
        const img = document.createElement('img');
        img.src = imageSrc;
        img.dataset.layer = 'base';
        container.appendChild(img);
        
        // Wait for image to load before showing
        img.onload = () => {
          console.log(`Image ${index} loaded successfully`);
          img.classList.add('active');
          
          // Set background to the first loaded image
          if (index === 0) {
            slideshow.style.setProperty('--current-image', `url(${imageSrc})`);
            console.log('Set background to:', imageSrc);
          }
        };
        
        img.onerror = () => {
          console.error(`Failed to load initial image ${index}: ${imageSrc}`);
        };
      });
      
      // Start timers after all images have had a chance to load
      setTimeout(() => {
        console.log('Starting timers...');
        for (let i = 0; i < 3; i++) {
          startImageTimer(i);
        }
      }, 3000); // Give images time to load before starting timers
    }
    
    // Start timer for a specific image position
    function startImageTimer(position) {
      clearTimeout(timers[position]);
      const duration = getRandomDuration();
      
      timers[position] = setTimeout(() => {
        replaceImage(position);
      }, duration);
    }
    
    // Replace image at specific position with a new random image
    function replaceImage(position) {
      const container = slideshow.querySelector(`.image-container[data-position="${position}"]`);
      if (!container) {
        console.log(`No container found for position ${position}`);
        return;
      }
      
      const currentImg = container.querySelector('img[data-layer="base"]');
      if (!currentImg) {
        console.log(`No current image found for position ${position}`);
        return;
      }
      
      // Get a new random image that's not currently displayed
      let newImageSrc;
      let attempts = 0;
      do {
        newImageSrc = images[Math.floor(Math.random() * images.length)];
        attempts++;
      } while (currentImages.includes(newImageSrc) && attempts < 20);
      
      console.log(`Replacing image at position ${position} with ${newImageSrc}`);
      
      // Update current images array immediately
      currentImages[position] = newImageSrc;
      
      // Create new image on top layer
      const newImg = document.createElement('img');
      newImg.src = newImageSrc;
      newImg.dataset.layer = 'top';
      newImg.style.opacity = '0';
      newImg.style.zIndex = '2'; // Ensure it's on top
      container.appendChild(newImg);
      
      // Wait for new image to load
      newImg.onload = () => {
        console.log(`New image loaded for position ${position}`);
        
        // Fade in new image
        newImg.style.opacity = '1';
        newImg.classList.add('active');
        
        // Set this new image as the background
        slideshow.style.setProperty('--current-image', `url(${newImageSrc})`);
        
        // After transition completes, swap layers
        setTimeout(() => {
          // Remove old image
          container.removeChild(currentImg);
          
          // Make new image the base layer
          newImg.dataset.layer = 'base';
          newImg.style.zIndex = '1';
          
          console.log(`Transition completed for position ${position}`);
          
          // Start next timer for this position
          startImageTimer(position);
        }, transitionDuration);
      };
      
      newImg.onerror = () => {
        console.error(`Failed to load image: ${newImageSrc}`);
        // Remove the failed image and try again
        container.removeChild(newImg);
        setTimeout(() => {
          startImageTimer(position);
        }, 1000);
      };
    }
    
    // Update blurred background to one of the current images
    function updateBackground() {
      const randomCurrentImage = currentImages[Math.floor(Math.random() * currentImages.length)];
      slideshow.style.setProperty('--current-image', `url(${randomCurrentImage})`);
    }
    
    // Manual navigation - refresh all images
    function refreshAllImages() {
      // Clear all timers
      timers.forEach(timer => clearTimeout(timer));
      timers = [];
      
      // Get three new random images
      const shuffledImages = shuffleArray(images);
      const newImages = shuffledImages.slice(0, 3);
      
      const containers = slideshow.querySelectorAll('.image-container');
      
      // Replace each image using the layered approach
      containers.forEach((container, index) => {
        if (newImages[index]) {
          const currentImg = container.querySelector('img[data-layer="base"]');
          const newImageSrc = newImages[index];
          
          // Update tracking
          currentImages[index] = newImageSrc;
          
          // Create new image on top layer
          const newImg = document.createElement('img');
          newImg.src = newImageSrc;
          newImg.dataset.layer = 'top';
          newImg.style.opacity = '0';
          newImg.style.zIndex = '2';
          container.appendChild(newImg);
          
          newImg.onload = () => {
            // Fade in new image
            newImg.style.opacity = '1';
            newImg.classList.add('active');
            
            // After transition, swap layers
            setTimeout(() => {
              if (currentImg && currentImg.parentElement === container) {
                container.removeChild(currentImg);
              }
              newImg.dataset.layer = 'base';
              newImg.style.zIndex = '1';
            }, transitionDuration);
          };
        }
      });
      
      // Set background to the first new image
      slideshow.style.setProperty('--current-image', `url(${newImages[0]})`);
      
      // Start timers for all positions after transition completes
      setTimeout(() => {
        for (let i = 0; i < 3; i++) {
          startImageTimer(i);
        }
      }, transitionDuration + 100);
    }
    
    // Navigation event listeners
    navLeft.addEventListener('click', (e) => {
      e.stopPropagation();
      refreshAllImages();
    });
    
    navRight.addEventListener('click', (e) => {
      e.stopPropagation();
      refreshAllImages();
    });
    
    // Clicking on slideshow
    slideshow.addEventListener('click', (e) => {
      const x = e.clientX;
      const width = window.innerWidth;
      if (x < width * 0.2 || x > width * 0.8) {
        refreshAllImages();
      }
    });
    
    // Settings panel toggling
    gearIcon.addEventListener('click', (e) => {
      settingsPanel.style.display = (settingsPanel.style.display === 'none' || settingsPanel.style.display === '') ? 'block' : 'none';
      e.stopPropagation();
    });
    
    document.getElementById('closeSettings').addEventListener('click', (e) => {
      settingsPanel.style.display = 'none';
      e.stopPropagation();
    });
    
    document.getElementById('applySettings').addEventListener('click', (e) => {
      minDuration = parseInt(document.getElementById('minDuration').value) * 1000;
      maxDuration = parseInt(document.getElementById('maxDuration').value) * 1000;
      transitionDuration = parseInt(document.getElementById('transitionDuration').value);
      
      // Update CSS transition duration
      const style = document.createElement('style');
      style.textContent = `
        .image-container img { transition: opacity ${transitionDuration}ms ease-in-out; }
        #slideshow::before { transition: background-image ${transitionDuration}ms ease-in-out; }
      `;
      document.head.appendChild(style);
      
      settingsPanel.style.display = 'none';
      e.stopPropagation();
    });
    
    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
        e.preventDefault();
        refreshAllImages();
      }
    });
    
    // Initialize
    loadImages();
  </script>
</body>
</html>
