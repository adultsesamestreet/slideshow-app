version: '3.8'

services:
  slideshow-website:
    build: .
    container_name: slideshow-website
    env_file:
      - docker-config.env
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    volumes:
      - ${IMAGES_PATH:-./images}:${IMAGES_ROOT:-/app/images}:ro
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - IMAGES_ROOT=${IMAGES_ROOT:-/app/images}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-3000}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
