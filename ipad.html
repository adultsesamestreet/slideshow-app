</head>
<body>
  <!-- Gear Icon & Settings Panel -->
  <div id="gearIcon">&#9881;</div>
  <div id="settingsPanel">
    <label>
      Display Duration (ms):
      <input type="number" id="displayDuration" value="30000">
    </label>
    <label>
      Transition Duration (ms):
      <input type="number" id="transitionDuration" value="1000">
    </label>
    <button id="applySettings">Apply Settings</button>
    <button id="closeSettings">Close</button>
  </div>
  
  <!-- Slideshow Container -->
  <div id="slideshow"></div>
  
  <!-- Hidden Navigation Areas -->
  <div id="nav-left" class="nav-area"></div>
  <div id="nav-right" class="nav-area"></div>
  
  <script>
    let images = [];
    let currentIndex = 0;
    let timer;
    let isTransitioning = false;
    let displayDuration = parseInt(document.getElementById('displayDuration').value);
    let transitionDuration = parseInt(document.getElementById('transitionDuration').value);
    
    const slideshow = document.getElementById('slideshow');
    const gearIcon = document.getElementById('gearIcon');
    const settingsPanel = document.getElementById('settingsPanel');
    const navLeft = document.getElementById('nav-left');
    const navRight = document.getElementById('nav-right');
    
    // Fisher-Yates shuffle to randomize image order
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }
    
    // Load images from the server API endpoint (e.g., /api/images)
    function loadImages() {
      fetch('/api/ipad')
        .then(response => response.json())
        .then(data => {
          images = shuffleArray(data);
          if (images.length > 0) {
            displayImage(currentIndex);
            startTimer();
          } else {
            slideshow.innerHTML = "<p>No images found.</p>";
          }
        })
        .catch(error => {
          console.error('Error loading images:', error);
          slideshow.innerHTML = "<p>Error loading images.</p>";
        });
    }
    
    // Display image at given index using fade transition.
    // Only one new image is created, and after transition the previous image is removed.
    function displayImage(index) {
  if (isTransitioning) return;
  isTransitioning = true;

  const newImg = document.createElement('img');
  newImg.src = images[index];
  newImg.style.opacity = 0;
  newImg.style.transform = 'translate(-50%, -50%) translateZ(0)'; // centre and enable GPU acceleration

  slideshow.appendChild(newImg);

  // Update the blurred background to the new image
  slideshow.style.setProperty('--current-image', `url(${images[index]})`);

  // Force reflow so that transition takes effect.
  void newImg.offsetWidth;

  newImg.style.opacity = 1;
  newImg.classList.add('active');

  // Fade out and then remove the previous image, if any.
  const currentImg = slideshow.querySelector('img.active:not(:last-child)');
  if (currentImg) {
    currentImg.style.opacity = 0;
    setTimeout(() => {
      if (currentImg.parentElement === slideshow) {
        slideshow.removeChild(currentImg);
      }
    }, transitionDuration);
  }

  // Update the current index and reset transition flag after the transition.
  setTimeout(() => {
    isTransitioning = false;
  }, transitionDuration);

  currentIndex = index;
}
    
    // Navigate to next image.
    function nextImage() {
      let newIndex = (currentIndex + 1) % images.length;
      displayImage(newIndex);
      resetTimer();
    }
    
    // Navigate to previous image.
    function prevImage() {
      let newIndex = (currentIndex - 1 + images.length) % images.length;
      displayImage(newIndex);
      resetTimer();
    }
    
    // Timer functions for auto-advance.
    function startTimer() {
      clearTimeout(timer);
      timer = setTimeout(nextImage, displayDuration);
    }
    
    function resetTimer() {
      clearTimeout(timer);
      startTimer();
    }
    
    // Navigation event listeners for left/right hidden areas.
    navLeft.addEventListener('click', (e) => {
      e.stopPropagation();
      prevImage();
    });
    navRight.addEventListener('click', (e) => {
      e.stopPropagation();
      nextImage();
    });
    
    // Also, clicking on the slideshow container (center 60% does nothing).
    slideshow.addEventListener('click', (e) => {
      const x = e.clientX;
      const width = window.innerWidth;
      if (x < width * 0.2) {
        prevImage();
      } else if (x > width * 0.8) {
        nextImage();
      }
    });
    
    // Settings panel toggling.
    gearIcon.addEventListener('click', (e) => {
      settingsPanel.style.display = (settingsPanel.style.display === 'none' || settingsPanel.style.display === '') ? 'block' : 'none';
      e.stopPropagation();
    });
    document.getElementById('closeSettings').addEventListener('click', (e) => {
      settingsPanel.style.display = 'none';
      e.stopPropagation();
    });
    document.getElementById('applySettings').addEventListener('click', (e) => {
      displayDuration = parseInt(document.getElementById('displayDuration').value);
      transitionDuration = parseInt(document.getElementById('transitionDuration').value);
      settingsPanel.style.display = 'none';
      resetTimer();
      e.stopPropagation();
    });
    
    loadImages();
  </script>
</body>
</html>
